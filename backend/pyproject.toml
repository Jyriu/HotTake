[tool.poetry]
name = "hottake-backend"
version = "0.1.0"
description = "FastAPI backend for HotTake social network"
authors = ["samiy <you@example.com>"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.29.0"}
sqlmodel = "^0.0.16"
psycopg2-binary = "^2.9.9"
redis = "^5.0.4"
aiofiles = "^23.2.1"
python-dotenv = "^1.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
black = "^24.3.0"
isort = "^5.13.2"
ruff = "^0.4.7"

[build-system]
requires = ["poetry-core>=1.7.0"]
build-backend = "poetry.core.masonry.api"
